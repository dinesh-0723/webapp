
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tall Mountains</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eaf4f4;

            color: #234e52;
        }

        }

        .mountain-image {

<body>

    <img class="mountain-image"

         alt="Tall mountains reaching into the sky">

    <img class="mountain-image"
         src="https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1000&q=80"
